apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver
  namespace: observability
data:
  # shortcut: Alerts are logged locally; use a durable external receiver for production.
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            body = self.rfile.read(int(self.headers.get("Content-Length", "0")))
            print(body.decode("utf-8"), flush=True)
            self.send_response(200)
            self.end_headers()

    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-receiver
  template:
    metadata:
      labels:
        app: alert-receiver
    spec:
      containers:
        - name: receiver
          image: python:3.12-alpine
          command: [python, /app/server.py]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: server
              mountPath: /app
      volumes:
        - name: server
          configMap:
            name: alert-receiver
---
apiVersion: v1
kind: Service
metadata:
  name: alert-receiver
  namespace: observability
spec:
  type: ClusterIP
  selector:
    app: alert-receiver
  ports:
    - port: 8080
      targetPort: 8080

grafana:
  persistence:
    enabled: true
    size: 2Gi

prometheus:
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

alertmanager:
  config:
    route:
      receiver: "null"
      group_by: [namespace, alertname]
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
        - receiver: local-webhook
          matchers:
            - team = "cluster-chronicles"
    receivers:
      - name: "null"
      - name: local-webhook
        webhook_configs:
          - url: http://alert-receiver.observability.svc.cluster.local:8080/
            send_resolved: true

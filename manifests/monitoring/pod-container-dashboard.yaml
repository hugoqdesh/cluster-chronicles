apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-container-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  pod-container.json: |
    {
      "uid": "pod-container-details",
      "title": "Kubernetes Pods and Containers",
      "tags": ["kubernetes", "pods", "containers"],
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-1h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*",
            "current": {"selected": true, "text": "All", "value": "$__all"}
          },
          {
            "name": "pod",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": "label_values(kube_pod_info{namespace=~\"$namespace\"}, pod)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "current": {"selected": true, "text": "All", "value": "$__all"}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "CPU usage by container",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "cores"}},
          "targets": [{"expr": "sum by (namespace, pod, container) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[5m]))", "legendFormat": "{{namespace}}/{{pod}} · {{container}}", "refId": "A"}]
        },
        {
          "id": 2,
          "title": "Memory working set by container",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "targets": [{"expr": "sum by (namespace, pod, container) (container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"})", "legendFormat": "{{namespace}}/{{pod}} · {{container}}", "refId": "A"}]
        },
        {
          "id": 3,
          "title": "Container restarts",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"expr": "sum by (namespace, pod, container) (kube_pod_container_status_restarts_total{namespace=~\"$namespace\",pod=~\"$pod\"})", "legendFormat": "{{namespace}}/{{pod}} · {{container}}", "refId": "A"}]
        },
        {
          "id": 4,
          "title": "Pod readiness",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"min": 0, "max": 1}},
          "targets": [{"expr": "max by (namespace, pod) (kube_pod_status_ready{namespace=~\"$namespace\",pod=~\"$pod\",condition=\"true\"})", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A"}]
        }
      ]
    }

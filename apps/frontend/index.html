<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sherlock Logs</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; }
      main { width: min(36rem, calc(100% - 3rem)); padding: 2rem; border: 1px solid #374151; border-radius: 1rem; background: #1f2937; }
      h1 { margin-top: 0; }
      #status { color: #fbbf24; }
      .ok { color: #34d399 !important; }
      .error { color: #f87171 !important; }
    </style>
  </head>
  <body>
    <main>
      <h1>Sherlock Logs</h1>
      <p id="status">Checking backend health...</p>
    </main>
    <script>
      fetch("/api/health")
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .then((body) => {
          const status = document.querySelector("#status");
          status.textContent = `Backend status: ${body.status}`;
          status.className = "ok";
        })
        .catch((error) => {
          const status = document.querySelector("#status");
          status.textContent = `Backend unavailable: ${error.message}`;
          status.className = "error";
        });
    </script>
  </body>
</html>
